# Broker credentials — DO NOT COMMIT
# Copy to credentials.yaml and fill in (gitignored)
#
# strategy/broker_login.py auto-logs into whichever section below is filled
# in first, preferring `metatrader:` — the account config/config.yaml's
# broker.account_id currently points at.

# MetaTrader Web Terminal (web.metatrader.app) — MetaQuotes-Demo or a broker's
# white-labeled MT5 web terminal.
metatrader:
  name: ""
  login: ""
  password: ""
  investor: ""
  server: ""
  type: ""
  terminal_url: "https://web.metatrader.app/terminal?lang=en"

exness:
  # Demo account number (digits only), e.g. 21000184446
  login: ""
  # Investor or trading password from Exness Personal Area / MT5
  password: ""
  # Examples: Exness-MT5Trial7, Exness-MT5Trial, Exness-MT5Real
  # Exact name from Exness → Personal Area → Account → MT5 server
  server: "Exness-MT5Trial"

# Optional: API token for Docker MT5 REST bridge
mt5_bridge:
  api_token: "change-me-secure-token"
  url: "http://localhost:8000"
  account_id: 0
